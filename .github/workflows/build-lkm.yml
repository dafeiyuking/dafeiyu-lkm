name: Build DaFeiYu KSU LKM

# Build kernelsu.ko (upstream KernelSU v3.3.1 kernel module) with our manager cert hash.
# Usage: Actions -> "Build DaFeiYu KSU LKM" -> Run workflow -> download Artifacts.

on:
  workflow_dispatch:

env:
  # DaFeiYuKing manager cert: 887 bytes (0x377)
  KSU_EXPECTED_SIZE: "0x0377"
  KSU_EXPECTED_HASH: "0cdac17eefa293ae16bcd9ccf0b6d5c358aa35751f6a47f7cf214021d16190d0"
  KSU_MANAGER_PACKAGE: "com.dfyking"
  KSU_VERSION: "32680"

jobs:
  build:
    name: Build kernelsu.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack kernel source
        run: |
          if command -v unzip >/dev/null 2>&1; then
            unzip -q lkm-kernel.zip
          else
            python3 -m zipfile -e lkm-kernel.zip .
          fi
          ls kernel | head

      - name: Fix KSU version fallback
        run: |
          sed -i 's/^ccflags-y += -DKSU_VERSION=16$/KSU_VERSION ?= 32680\nccflags-y += -DKSU_VERSION=$(KSU_VERSION)/' kernel/Kbuild
          grep -n 'KSU_VERSION' kernel/Kbuild | head
      - name: Build kernelsu.ko
        run: |
          cd kernel
          CONFIG_KSU=m CC=clang make \
            KSU_VERSION="$KSU_VERSION" \
            KSU_VERSION_FULL="v3.3.1-dafeiyu" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            KSU_PACKAGE_NAME="$KSU_MANAGER_PACKAGE"

          OUT="$GITHUB_WORKSPACE/kernelsu-${{ matrix.kmi }}-dafeiyu.ko"
          cp kernelsu.ko "$OUT"
          llvm-strip -d "$OUT" || true
          ls -lh "$OUT"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.kmi }}-dafeiyu
          path: kernelsu-${{ matrix.kmi }}-dafeiyu.ko